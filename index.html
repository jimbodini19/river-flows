function cToF(c) { return c == null ? null : c * 9 / 5 + 32; }
function tempClass(f) {
  if (f == null) return 'temp-none';
  if (f < 50) return 'temp-cold';
  if (f <= 65) return 'temp-ideal';
  if (f <= 70) return 'temp-warm';
  return 'temp-hot';
}
function formatCFS(v) {
  if (v == null) return '–';
  if (v >= 10000) return (v / 1000).toFixed(1) + 'k';
  if (v >= 100) return Math.round(v).toLocaleString();
  return v.toFixed(0);
}
function getFishability(siteId, cfs) {
  const f = FISHABILITY[siteId];
  if (!f || cfs == null) return { status: 'No data', cls: 'unknown', range: f || null };
  let cls, status;
  if (cfs >= f.blown) { cls = 'blown'; status = 'Blown'; }
  else if (cfs >= f.high) { cls = 'high'; status = 'High'; }
  else if (cfs >= f.ideal[0] && cfs <= f.ideal[1]) { cls = 'ideal'; status = 'Ideal'; }
  else if (cfs < f.low) { cls = 'low'; status = 'Low'; }
  else { cls = 'fishable'; status = 'Fishable'; }
  return { status, cls, range: f };
}

function getTrend(spark) {
  if (!spark || spark.length < 7) return null;
  const recent = spark.slice(-7);
  const earlier = spark.slice(-14, -7);
  if (!earlier.length) return null;
  const recAvg = recent.reduce((s, v) => s + v, 0) / recent.length;
  const earAvg = earlier.reduce((s, v) => s + v, 0) / earlier.length;
  return (recAvg - earAvg) / earAvg;
}

function getBrief(g, fish) {
  // Rule-based fishing brief per card
  const tempF = g.tempC != null ? cToF(g.tempC) : null;
  const trend = getTrend(g.spark30);
  const isPick = fish.cls === 'ideal' && (tempF == null || (tempF >= 50 && tempF <= 65));
  const parts = [];

  if (isPick) parts.push('<span class="pick-star">★ Best pick</span>');

  if (fish.cls === 'blown') {
    parts.push('Skip it. Wait for flows to drop and color to clear.');
  } else if (fish.cls === 'high') {
    parts.push('Big and pushy. Streamers and heavy nymphs in seams and soft edges. Dry-dropper on slower banks if water has clarity.');
  } else if (fish.cls === 'ideal') {
    // Tactical guidance depends on temp
    if (tempF == null) {
      parts.push('Prime flow. Dry-dropper through riffles, single dries on the soft water late afternoon, nymphs deep through runs.');
    } else if (tempF >= 55 && tempF <= 65) {
      parts.push('Prime flow and water temp. Dry-dropper through riffles, single dries late afternoon as hatches come off. Bugs should be moving.');
    } else if (tempF < 55) {
      parts.push('Prime flow but cold water. Nymphs deep through runs, swing streamers. Dry action limited until water hits 50°F.');
    } else if (tempF <= 67) {
      parts.push('Prime flow, water trending warm. Dries early morning and again at last light, dry-dropper midday, nymphs in shade.');
    }
  } else if (fish.cls === 'fishable') {
    parts.push('Fishable. Dry-dropper covers your bases. Fish technical water, longer leaders, smaller flies.');
  } else if (fish.cls === 'low') {
    parts.push('Thin water. Fish stacked in deeper runs and tailouts. Small dries, fine tippet, careful approach. Dawn and dusk are your friends.');
  }

  if (tempF != null) {
    if (tempF >= 68) parts.push(`Water is ${tempF.toFixed(0)}°F — ethical concerns for trout. Fish dawn only or skip.`);
    else if (tempF <= 45) parts.push(`Cold ${tempF.toFixed(0)}°F water; fish slow and deep.`);
  }

  if (trend != null) {
    if (trend > 0.20) parts.push('Flows rising fast over the past week.');
    else if (trend < -0.20) parts.push('Flows dropping; conditions stabilizing.');
  }

  return { html: parts.join(' '), isPick };
}

function renderSparkline(canvas, data) {
  if (!data || data.length < 3) return;
  new Chart(canvas, {
    type: 'line',
    data: {
      labels: data.map((_, i) => i),
      datasets: [{
        data,
        borderColor: '#7ec487',
        backgroundColor: 'rgba(126, 196, 135, 0.15)',
        borderWidth: 1.4,
        pointRadius: 0,
        tension: 0.3,
        fill: true,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: { x: { display: false }, y: { display: false, beginAtZero: false } },
      animation: false,
    },
  });
}

      const rangeText = fish.range ? `Ideal ${formatCFS(fish.range.ideal[0])}–${formatCFS(fish.range.ideal[1])} cfs` : '';
      const cfsBlock = g.cfs == null
        ? `<div class="no-data">No data right now</div>`

      const gaugeUrl = g.source === 'bor' ? 'https://www.usbr.gov/pn/hydromet/yakima/' : 'https://waterdata.usgs.gov/monitoring-location/' + g.id + '/';
      html += `<a href="${gaugeUrl}" target="_blank" rel="noopener" class="card ${fish.cls}">
        <div class="card-header">
          <div>
            <div class="gauge-name">${g.name}</div>
            <div class="gauge-id">${g.source === 'bor' ? 'BOR' : 'USGS'} #${g.id} ↗</div>
          </div>
          <div class="species-tags">${tags}</div>
        </div>
        ${cfsBlock}
        <div class="fishability-row">
          <span class="fish-pill ${fish.cls}">${fish.status}</span>
          <span class="range-info">${rangeText}</span>
        </div>
        ${tempF != null ? `<div class="temp"><span class="temp-dot ${tempClass(tempF)}"></span>${tempF.toFixed(1)}°F water</div>` : ''}
        ${g.spark30 && g.spark30.length >= 3 ? `
        <div class="sparkline-label">30-day flow</div>
        <div class="sparkline-wrap"><canvas id="spark-${g.id}"></canvas></div>` : ''}
        ${g.cfs != null ? (() => { const b = getBrief(g, fish); return `<div class="brief ${b.isPick ? 'pick' : ''}">${b.html}</div>`; })() : ''}
      </a>`;
    }
    html += '</div></div>';
  }
  content.innerHTML = html;
  // Render sparklines
  for (const g of filtered) {
    if (g.spark30 && g.spark30.length >= 3) {
      const canvas = document.getElementById(`spark-${g.id}`);
      if (canvas) renderSparkline(canvas, g.spark30);
    }
  }
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    localStorage.setItem('riverflows_species', btn.dataset.species);
    render();
  });
});

const savedSpecies = localStorage.getItem('riverflows_species');
if (savedSpecies) {
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.species === savedSpecies);
  });
}

render();
</script>
</body>
</html>
