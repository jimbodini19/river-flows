function cToF(c) { return c == null ? null : c * 9 / 5 + 32; }
function tempClass(f) {
  if (f == null) return 'temp-none';
  if (f < 50) return 'temp-cold';
  if (f <= 65) return 'temp-ideal';
  if (f <= 70) return 'temp-warm';
  return 'temp-hot';
}
function formatCFS(v) {
  if (v == null) return '–';
  if (v >= 10000) return (v / 1000).toFixed(1) + 'k';
  if (v >= 100) return Math.round(v).toLocaleString();
  return v.toFixed(0);
}
function getStatus(range, cfs) {
  if (!range || cfs == null) return { status: 'No data', cls: 'unknown', range: range || null };
  let cls, status;
  if (cfs >= range.blown) { cls = 'blown'; status = 'Blown'; }
  else if (cfs >= range.high) { cls = 'high'; status = 'High'; }
  else if (cfs >= range.ideal[0] && cfs <= range.ideal[1]) { cls = 'ideal'; status = 'Ideal'; }
  else if (cfs < range.low) { cls = 'low'; status = 'Low'; }
  else { cls = 'fishable'; status = 'Fishable'; }
  return { status, cls, range };
}
// wade ranking (back-compat name)
function getFishability(siteId, cfs) { return getStatus(FISHABILITY[siteId], cfs); }
// lower = better, used to pick the headline mode and rank picks
const CLS_RANK = { ideal: 0, fishable: 1, high: 2, low: 3, blown: 4, unknown: 5 };
// returns wade status, optional float status, and the better of the two as the headline
function getModes(g) {
  const wade = getStatus(FISHABILITY[g.id], g.cfs);
  const float = FLOAT[g.id] ? getStatus(FLOAT[g.id], g.cfs) : null;
  let best = wade, mode = 'wade';
  if (float && CLS_RANK[float.cls] < CLS_RANK[wade.cls]) { best = float; mode = 'float'; }
  return { wade, float, best, mode };
}
function getTrend(spark) {
  if (!spark || spark.length < 7) return null;
  const recent = spark.slice(-7);
  const earlier = spark.slice(-14, -7);
  if (!earlier.length) return null;
  const recAvg = recent.reduce((s, v) => s + v, 0) / recent.length;
  const earAvg = earlier.reduce((s, v) => s + v, 0) / earlier.length;
  return (recAvg - earAvg) / earAvg;
}
function getBrief(g, modes) {
  const fish = modes.best;
  const tempF = g.tempC != null ? cToF(g.tempC) : null;
  const trend = getTrend(g.spark30);
  const isPick = fish.cls === 'ideal' && (tempF == null || (tempF >= 50 && tempF <= 65));
  const parts = [];
  if (isPick) parts.push('<span class="pick-star">★ Best pick</span>');
  // headline came from the float profile while wading is off: lead with that
  if (modes.mode === 'float' && modes.wade && CLS_RANK[modes.wade.cls] > CLS_RANK[fish.cls]) {
    parts.push('Too high to wade, but in shape to float.');
  }
  if (fish.cls === 'blown') {
    parts.push('Skip it. Wait for flows to drop and color to clear.');
  } else if (fish.cls === 'high') {
    parts.push('Big and pushy. Streamers and heavy nymphs in seams and soft edges. Dry-dropper on slower banks if water has clarity.');
  } else if (fish.cls === 'ideal') {
    if (tempF == null) {
      parts.push('Prime flow. Dry-dropper through riffles, single dries on the soft water late afternoon, nymphs deep through runs.');
    } else if (tempF >= 55 && tempF <= 65) {
      parts.push('Prime flow and water temp. Dry-dropper through riffles, single dries late afternoon as hatches come off. Bugs should be moving.');
    } else if (tempF < 55) {
      parts.push('Prime flow but cold water. Nymphs deep through runs, swing streamers. Dry action limited until water hits 50°F.');
    } else if (tempF <= 67) {
      parts.push('Prime flow, water trending warm. Dries early morning and again at last light, dry-dropper midday, nymphs in shade.');
    }
  } else if (fish.cls === 'fishable') {
    parts.push('Fishable. Dry-dropper covers your bases. Fish technical water, longer leaders, smaller flies.');
  } else if (fish.cls === 'low') {
    parts.push('Thin water. Fish stacked in deeper runs and tailouts. Small dries, fine tippet, careful approach. Dawn and dusk are your friends.');
  }
  if (tempF != null) {
    if (tempF >= 68) parts.push(`Water is ${tempF.toFixed(0)}°F — ethical concerns for trout. Fish dawn only or skip.`);
    else if (tempF <= 45) parts.push(`Cold ${tempF.toFixed(0)}°F water; fish slow and deep.`);
  }
  if (trend != null) {
    if (trend > 0.20) parts.push('Flows rising fast over the past week.');
    else if (trend < -0.20) parts.push('Flows dropping; conditions stabilizing.');
  }
  return { html: parts.join(' '), isPick };
}

// ----- Reservoir releases -----
function getResView(r) {
  const t = getTrend(r.outflow30);
  let trendWord, arrow, arrowCls;
  if (t == null || Math.abs(t) <= 0.15) { trendWord = 'steady'; arrow = '▬'; arrowCls = 'res-flat'; }
  else if (t > 0.15) { trendWord = 'rising'; arrow = '▲'; arrowCls = 'res-up'; }
  else { trendWord = 'falling'; arrow = '▼'; arrowCls = 'res-down'; }
  const pct = Math.round(r.storageAF / r.capacityAF * 100);
  let storageDir = '';
  if (r.storagePrevAF != null) {
    if (r.storageAF > r.storagePrevAF) storageDir = '▲ filling';
    else if (r.storageAF < r.storagePrevAF) storageDir = '▼ drawing down';
    else storageDir = 'steady';
  }
  let read;
  if (r.id === 'CLE') {
    const base = 'Drives the upper Yakima (Easton down through the canyon).';
    if (trendWord === 'rising') read = base + ' Releases climbing, expect the canyon to bump up over the next day or two.';
    else if (trendWord === 'falling') read = base + ' Releases easing, river dropping and clearing.';
    else read = base + ' Steady flows in the canyon.';
  } else { // RIM
    const base = 'Drives the Naches and Tieton.';
    if (r.outflow < 700) read = base + ' Low summer baseline, the Tieton stays skinny until the fall flip-flop ramp.';
    else if (trendWord === 'rising') read = base + ' Releases climbing, Naches and Tieton coming up.';
    else read = base + ' Moderate flows on the Naches.';
  }
  return { trendWord, arrow, arrowCls, pct, storageDir, read };
}
function flipflopStatus() {
  const now = new Date();
  const m = now.getMonth() + 1, d = now.getDate();
  const inWindow = (m === 8 && d >= 20) || m === 9 || (m === 10 && d <= 15);
  if (!inWindow) return null;
  const cle = RESERVOIRS.find(r => r.id === 'CLE');
  const rim = RESERVOIRS.find(r => r.id === 'RIM');
  const cleT = cle ? getTrend(cle.outflow30) : null;
  const rimT = rim ? getTrend(rim.outflow30) : null;
  if (cleT != null && rimT != null && cleT < -0.1 && rimT > 0.1)
    return { active: true, text: 'Flip-flop underway: Cle Elum dropping, Rimrock ramping. Upper Yakima coming down, Naches and Tieton coming up.' };
  return { active: false, text: 'Flip-flop window: watch for Cle Elum to drop and Rimrock to climb (protects fall Chinook redds).' };
}
function renderReservoirs() {
  const ff = flipflopStatus();
  let h = '<div class="res-panel"><div class="res-panel-title">Reservoir Releases <span class="res-sub">dam outflows that drive the rivers below &middot; as of ' + RES_UPDATED + '</span></div>';
  if (ff) h += `<div class="flipflop-banner ${ff.active ? 'ff-active' : ''}">${ff.active ? '🔄 ' : '👀 '}${ff.text}</div>`;
  h += '<div class="res-grid">';
  for (const r of RESERVOIRS) {
    const v = getResView(r);
    h += `<div class="res-card">
      <div class="res-head">
        <div><div class="res-name">${r.name}</div><div class="res-drives">drives ${r.drives}</div></div>
        <a href="https://www.usbr.gov/pn/hydromet/yakima/yaktea.html" target="_blank" rel="noopener" class="res-tag">DAM ↗</a>
      </div>
      <div class="res-stats">
        <span class="res-cfs">${formatCFS(r.outflow)}</span><span class="res-unit">cfs out</span>
        <span class="res-trend ${v.arrowCls}">${v.arrow} ${v.trendWord}</span>
      </div>
      <div class="res-storage">
        <div class="res-storage-bar"><div class="res-storage-fill" style="width:${v.pct}%"></div></div>
        <div class="res-storage-label">${v.pct}% full &middot; ${v.storageDir}</div>
      </div>
      <div class="sparkline-label">30-day release</div>
      <div class="sparkline-wrap"><canvas id="res-spark-${r.id}"></canvas></div>
      <div class="res-read">${v.read}</div>
    </div>`;
  }
  h += '</div></div>';
  return h;
}

// ----- Toccoa / Blue Ridge Dam generation schedule (GA) -----
function renderToccoa() {
  if (typeof TOCCOA_GEN === 'undefined' || !TOCCOA_GEN.length) return '';
  const byDay = {};
  for (const r of TOCCOA_GEN) { (byDay[r.day] = byDay[r.day] || []).push(r); }
  // anchor "today" to Eastern time (the dam's schedule timezone), not the viewer's
  const etNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const todayMid = new Date(etNow.getFullYear(), etNow.getMonth(), etNow.getDate());
  const fmtDay = (d) => {
    const [mm, dd, yy] = d.split('/').map(Number);
    const dt = new Date(yy, mm - 1, dd);
    const diff = Math.round((dt - todayMid) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][dt.getDay()] + ' ' + mm + '/' + dd;
  };
  let rows = '';
  for (const day of Object.keys(byDay)) {
    const chips = byDay[day].map(r =>
      `<span class="gen-chip ${r.gen >= 1 ? 'on' : 'off'}">${r.time}${r.gen >= 1 ? ' · ON' : ''}</span>`).join('');
    rows += `<div class="gen-day"><span class="gen-date">${fmtDay(day)}</span><span class="gen-chips">${chips}</span></div>`;
  }
  return `<div class="toccoa-panel">
    <div class="toccoa-title">Blue Ridge Dam <span class="toccoa-sub">Toccoa tailwater &middot; ${formatCFS(TOCCOA_DISCHARGE)} cfs now &middot; as of ${TOCCOA_UPDATED}</span></div>
    <div class="toccoa-note">Wade the green (off) windows. When a generator kicks on, discharge climbs toward ~1,700 cfs within an hour.</div>
    ${rows}
    <a href="https://www.tva.com/environment/lake-levels/blue-ridge" target="_blank" rel="noopener" class="toccoa-link">TVA full schedule ↗</a>
  </div>`;
}

let sparkCharts = [];
function renderSparkline(canvas, data, color) {
  if (!data || data.length < 3) return;
  const line = color || '#7ec487';
  const fill = color === '#58a6ff' ? 'rgba(88, 166, 255, 0.15)' : 'rgba(126, 196, 135, 0.15)';
  const chart = new Chart(canvas, {
    type: 'line',
    data: { labels: data.map((_, i) => i), datasets: [{ data, borderColor: line, backgroundColor: fill, borderWidth: 1.4, pointRadius: 0, tension: 0.3, fill: true }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: false } }, scales: { x: { display: false }, y: { display: false, beginAtZero: false } }, animation: false },
  });
  sparkCharts.push(chart);
}

// ----- Filter + view state -----
const HOME_STATE = 'WA';
const DEFAULT_STATES = [HOME_STATE]; // default: home water only
let selectedStates = new Set(DEFAULT_STATES);
let selectedSpecies = 'all';
let selectedSort = 'location'; // 'location' | 'fish'
let currentFiltered = [];

function loadFilters() {
  try {
    // One-time migration to v2: reset the saved state filter so the new WA default takes effect once.
    if (localStorage.getItem('riverflows_schema') !== '2') {
      localStorage.removeItem('riverflows_states');
      localStorage.setItem('riverflows_schema', '2');
    }
    const savedStates = localStorage.getItem('riverflows_states');
    if (savedStates) {
      const arr = JSON.parse(savedStates);
      if (Array.isArray(arr) && arr.length > 0) {
        selectedStates = new Set(arr.filter(s => STATE_ORDER.includes(s)));
        if (selectedStates.size === 0) selectedStates = new Set(DEFAULT_STATES);
      }
    }
    const savedSpecies = localStorage.getItem('riverflows_species');
    if (savedSpecies && ['all', 'trout', 'steelhead'].includes(savedSpecies)) selectedSpecies = savedSpecies;
    const savedSort = localStorage.getItem('riverflows_sort');
    if (savedSort && ['location', 'fish'].includes(savedSort)) selectedSort = savedSort;
  } catch (e) { /* ignore */ }
}
function saveFilters() {
  localStorage.setItem('riverflows_states', JSON.stringify([...selectedStates]));
  localStorage.setItem('riverflows_species', selectedSpecies);
  localStorage.setItem('riverflows_sort', selectedSort);
}
function loadDestCollapsed() { try { return localStorage.getItem('riverflows_dest_collapsed') === '1'; } catch (e) { return false; } }
function saveDestCollapsed(v) { try { localStorage.setItem('riverflows_dest_collapsed', v ? '1' : '0'); } catch (e) { /* ignore */ } }

function syncFilterUI() {
  const allOn = selectedStates.size === STATE_ORDER.length;
  document.querySelectorAll('#state-filter .filter-btn').forEach(b => {
    const s = b.dataset.state;
    if (s === 'ALL') b.classList.toggle('active', allOn);
    else b.classList.toggle('active', selectedStates.has(s) && !allOn);
  });
  document.querySelectorAll('#species-filter .filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.species === selectedSpecies);
  });
  document.querySelectorAll('#sort-filter .filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.sort === selectedSort);
  });
}

// ----- Fishability ranking (lower = better) -----
function fishRank(g) {
  const fish = getModes(g).best;
  const tempF = g.tempC != null ? cToF(g.tempC) : null;
  const isPick = fish.cls === 'ideal' && (tempF == null || (tempF >= 50 && tempF <= 65));
  const order = { ideal: 1, fishable: 2, low: 3, high: 4, blown: 5, unknown: 6 };
  return isPick ? 0 : (order[fish.cls] != null ? order[fish.cls] : 6);
}
// distance from the center of the best mode's ideal window, normalized by window width (lower = closer to perfect)
function idealProximity(g) {
  const f = getModes(g).best.range;
  if (!f || g.cfs == null) return Infinity;
  const lo = f.ideal[0], hi = f.ideal[1];
  const center = (lo + hi) / 2;
  const width = (hi - lo) || 1;
  return Math.abs(g.cfs - center) / width;
}

// ----- Single gauge card -----
function renderCard(g, showRegion) {
  const tempF = g.tempC != null ? cToF(g.tempC) : null;
  const modes = getModes(g);
  const fish = modes.best;
  const tags = g.species.map(s => `<span class="tag tag-${s}">${s === 'trout' ? 'Trout' : 'Steel'}</span>`).join('');
  const cfsBlock = g.cfs == null
    ? `<div class="no-data">No data right now</div>`
    : `<div class="stats"><span class="cfs-value">${formatCFS(g.cfs)}</span><span class="cfs-unit">cfs</span></div>`;
  const gaugeUrl = g.source === 'bor' ? 'https://www.usbr.gov/pn/hydromet/yakima/' : 'https://waterdata.usgs.gov/monitoring-location/' + g.id + '/';
  const regionLabel = showRegion ? `<div class="gauge-region">${g.region}</div>` : '';
  // Wade pill always; Float pill only when the gauge has a float profile.
  let pills = `<span class="fish-pill ${modes.wade.cls}"><span class="mode">Wade</span>${modes.wade.status}</span>`;
  let rangeText;
  if (modes.float) {
    pills += `<span class="fish-pill ${modes.float.cls}"><span class="mode">Float</span>${modes.float.status}</span>`;
    rangeText = `Wade ${formatCFS(modes.wade.range.ideal[0])}–${formatCFS(modes.wade.range.ideal[1])} &middot; Float ${formatCFS(modes.float.range.ideal[0])}–${formatCFS(modes.float.range.ideal[1])} cfs`;
  } else {
    rangeText = modes.wade.range ? `Ideal ${formatCFS(modes.wade.range.ideal[0])}–${formatCFS(modes.wade.range.ideal[1])} cfs` : '';
  }
  return `<a id="card-${g.id}" href="${gaugeUrl}" target="_blank" rel="noopener" class="card ${fish.cls}">
    <div class="card-header">
      <div>
        <div class="gauge-name">${g.name}</div>
        ${regionLabel}
        <div class="gauge-id">${g.source === 'bor' ? 'BOR' : 'USGS'} #${g.id} ↗</div>
      </div>
      <div class="species-tags">${tags}</div>
    </div>
    ${cfsBlock}
    <div class="fishability-row">
      ${pills}
    </div>
    <div class="range-row"><span class="range-info">${rangeText}</span></div>
    ${tempF != null ? `<div class="temp"><span class="temp-dot ${tempClass(tempF)}"></span>${tempF.toFixed(1)}°F water</div>` : ''}
    ${g.spark30 && g.spark30.length >= 3 ? `
    <div class="sparkline-label">30-day flow</div>
    <div class="sparkline-wrap"><canvas id="spark-${g.id}"></canvas></div>` : ''}
    ${g.cfs != null ? (() => { const b = getBrief(g, modes); return `<div class="brief ${b.isPick ? 'pick' : ''}">${b.html}</div>`; })() : ''}
  </a>`;
}

// ----- Today's picks strip (summary + best-pick chips) -----
function renderTopStrip(filtered) {
  const counts = { ideal: 0, fishable: 0, low: 0, high: 0, blown: 0, unknown: 0 };
  const picks = [];
  for (const g of filtered) {
    const fish = getModes(g).best;
    counts[fish.cls] = (counts[fish.cls] || 0) + 1;
    const tempF = g.tempC != null ? cToF(g.tempC) : null;
    if (fish.cls === 'ideal' && (tempF == null || (tempF >= 50 && tempF <= 65))) picks.push(g);
  }
  const pillDefs = [['ideal', 'ideal'], ['fishable', 'fishable'], ['low', 'low'], ['high', 'high'], ['blown', 'blown']];
  const pills = pillDefs.filter(([k]) => counts[k] > 0)
    .map(([k, label]) => `<span class="sum-pill sum-${k}">${counts[k]} ${label}</span>`).join('');
  picks.sort((a, b) => idealProximity(a) - idealProximity(b)); // closest to perfect first
  let picksHtml;
  if (picks.length) {
    picksHtml = picks.slice(0, 3).map(g =>
      `<button type="button" class="pick-chip" onclick="jumpToCard('${g.id}')">★ ${g.name} <span class="pick-chip-cfs">${formatCFS(g.cfs)} cfs</span></button>`).join('');
  } else {
    picksHtml = '<span class="picks-empty">Nothing in prime shape in this filter right now.</span>';
  }
  return `<div class="top-strip">
    <div class="sum-row">${pills || '<span class="picks-empty">No data</span>'}</div>
    <div class="picks-label">Top picks right now</div>
    <div class="picks-row">${picksHtml}</div>
  </div>`;
}

// ----- One state's section (region groups, or flat best-first list) -----
function renderStateBlock(state, regions) {
  const total = Object.values(regions).reduce((s, arr) => s + arr.length, 0);
  let html = `<div class="state-section"><div class="state-title">${STATE_NAMES[state]} <span class="state-count">${total} gauge${total === 1 ? '' : 's'}</span></div>`;
  if (state === 'WA' && selectedSpecies !== 'steelhead') html += renderReservoirs();
  if (state === 'GA') html += renderToccoa();
  if (selectedSort === 'fish') {
    const all = [].concat(...Object.values(regions)).slice().sort((a, b) => {
      const d = fishRank(a) - fishRank(b);
      return d !== 0 ? d : (b.cfs || 0) - (a.cfs || 0);
    });
    html += '<div class="grid">';
    for (const g of all) html += renderCard(g, true);
    html += '</div>';
  } else {
    for (const regionName of Object.keys(regions)) {
      html += `<div class="region"><div class="region-title">${regionName}</div><div class="grid">`;
      for (const g of regions[regionName]) html += renderCard(g, false);
      html += '</div></div>';
    }
  }
  html += '</div>';
  return html;
}

// global: jump from a pick chip to its card (expands destination section if needed)
function jumpToCard(id) {
  const el = document.getElementById('card-' + id);
  if (!el) return;
  const body = document.getElementById('dest-body');
  if (body && body.contains(el) && body.style.display === 'none') {
    body.style.display = '';
    const arrow = document.getElementById('dest-arrow');
    if (arrow) arrow.textContent = '▾';
    saveDestCollapsed(false);
    renderVisibleSparklines();
  }
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// render sparklines only for currently-visible cards (skips collapsed destination cards)
function renderVisibleSparklines() {
  const body = document.getElementById('dest-body');
  const destCollapsed = body ? body.style.display === 'none' : false;
  for (const g of currentFiltered) {
    if (!(g.spark30 && g.spark30.length >= 3)) continue;
    if (g.state !== HOME_STATE && destCollapsed) continue;
    const cv = document.getElementById('spark-' + g.id);
    if (cv && !cv.dataset.rendered) { renderSparkline(cv, g.spark30); cv.dataset.rendered = '1'; }
  }
  if (selectedStates.has(HOME_STATE) && selectedSpecies !== 'steelhead') {
    for (const r of RESERVOIRS) {
      const cv = document.getElementById('res-spark-' + r.id);
      if (cv && !cv.dataset.rendered) { renderSparkline(cv, r.outflow30, '#58a6ff'); cv.dataset.rendered = '1'; }
    }
  }
}

function render() {
  const content = document.getElementById('content');
  const filtered = GAUGES.filter(g =>
    selectedStates.has(g.state) &&
    (selectedSpecies === 'all' || g.species.includes(selectedSpecies))
  );
  currentFiltered = filtered;
  const byState = {};
  for (const g of filtered) {
    if (!byState[g.state]) byState[g.state] = {};
    if (!byState[g.state][g.region]) byState[g.state][g.region] = [];
    byState[g.state][g.region].push(g);
  }
  let html = filtered.length ? renderTopStrip(filtered) : '';
  if (byState[HOME_STATE]) html += renderStateBlock(HOME_STATE, byState[HOME_STATE]);
  const destStates = STATE_ORDER.filter(s => s !== HOME_STATE && byState[s]);
  if (destStates.length) {
    const collapsed = loadDestCollapsed();
    const destTotal = destStates.reduce((n, s) => n + Object.values(byState[s]).reduce((a, arr) => a + arr.length, 0), 0);
    html += `<div class="dest-wrap">
      <button type="button" class="dest-toggle" id="dest-toggle"><span id="dest-arrow">${collapsed ? '▸' : '▾'}</span> Destination waters <span class="dest-count">${destStates.map(s => STATE_NAMES[s]).join(' · ')} &middot; ${destTotal} gauges</span></button>
      <div class="dest-body" id="dest-body" style="${collapsed ? 'display:none' : ''}">`;
    for (const s of destStates) html += renderStateBlock(s, byState[s]);
    html += `</div></div>`;
  }
  if (!html) html = '<div class="no-data">No gauges match the current filters.</div>';
  // Tear down existing sparkline charts before replacing the DOM (avoids leaking Chart instances on re-filter)
  sparkCharts.forEach(c => c.destroy());
  sparkCharts = [];
  content.innerHTML = html;
  renderVisibleSparklines();
  const destToggle = document.getElementById('dest-toggle');
  if (destToggle) {
    destToggle.addEventListener('click', () => {
      const body = document.getElementById('dest-body');
      const arrow = document.getElementById('dest-arrow');
      const nowCollapsed = body.style.display !== 'none';
      body.style.display = nowCollapsed ? 'none' : '';
      if (arrow) arrow.textContent = nowCollapsed ? '▸' : '▾';
      saveDestCollapsed(nowCollapsed);
      if (!nowCollapsed) renderVisibleSparklines();
    });
  }
}

// ----- Filter event handlers -----
document.querySelectorAll('#state-filter .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const s = btn.dataset.state;
    if (s === 'ALL') {
      selectedStates = new Set(STATE_ORDER);
    } else {
      // If "all" is currently on, clicking a single state means "only that state"
      if (selectedStates.size === STATE_ORDER.length) {
        selectedStates = new Set([s]);
      } else if (selectedStates.has(s)) {
        selectedStates.delete(s);
        if (selectedStates.size === 0) selectedStates = new Set(DEFAULT_STATES); // never empty
      } else {
        selectedStates.add(s);
      }
    }
    saveFilters();
    syncFilterUI();
    render();
  });
});
document.querySelectorAll('#species-filter .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedSpecies = btn.dataset.species;
    saveFilters();
    syncFilterUI();
    render();
  });
});
document.querySelectorAll('#sort-filter .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedSort = btn.dataset.sort;
    saveFilters();
    syncFilterUI();
    render();
  });
});

// Warn if the data hasn't refreshed recently (e.g. the 2am job couldn't reach Chrome).
function checkStale() {
  const el = document.getElementById('meta');
  const banner = document.getElementById('stale-banner');
  if (!el || !banner) return;
  const raw = el.textContent.replace('Updated:', '').replace(' at ', ' ').replace(/\s*PT\s*$/, '').trim();
  const d = new Date(raw);
  if (isNaN(d.getTime())) return;
  const hrs = (Date.now() - d.getTime()) / 3600000;
  if (hrs > 28) {
    const age = hrs >= 48 ? Math.floor(hrs / 24) + ' days' : Math.round(hrs) + ' hours';
    banner.innerHTML = `<strong>⚠ Flows are ${age} stale.</strong> The auto-refresh hasn't run — most likely Chrome was closed when it fired. Open Chrome and it'll catch up on the next scheduled run (it now retries through the morning), or refresh manually.`;
    banner.style.display = '';
  }
}

loadFilters();
syncFilterUI();
render();
checkStale();
</script>
</body>
</html>
