name: Refresh river flows

# Fetches USGS + BOR data directly over HTTPS (no browser, no Mac needed) and
# commits the rebuilt index.html. GitHub Pages then serves the update.
on:
  schedule:
    # 09:00 UTC = ~2 AM Pacific in summer (PDT) / 1 AM in winter (PST).
    # Add a second line (e.g. '0 21 * * *') if you want a twice-daily refresh.
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: river-flows-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build index.html from live data
        run: python scripts/build.py

      - name: Commit if changed
        run: |
          git config user.name "river-flows bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
